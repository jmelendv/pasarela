<div class="login-container">
  <div
    *ngIf="errorMessage"
    class="login-popup"
    [class.popup-error]="popupType === 'error'"
    [class.popup-warning]="popupType === 'warning'"
    [class.popup-success]="popupType === 'success'"
    role="alert"
    aria-live="assertive"
  >
    {{ errorMessage }}
  </div>
  <div class="login-card">
    <h2>Iniciar Sesión</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="username">Usuario:</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Tu usuario"
          class="form-control"
        />
        <small *ngIf="isFieldInvalid('username')" class="error">
          Usuario requerido
        </small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Tu contraseña"
          class="form-control"
        />
        <small *ngIf="isFieldInvalid('password')" class="error">
          Contraseña requerida (mín. 6 caracteres)
        </small>
      </div>

      <button type="submit" [disabled]="!loginForm.valid || isLoading" class="btn-login">
        {{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <div class="demo-hint">
      <p><strong>Acceso:</strong> Ingresa tu usuario y contraseña para autenticarte.</p>
    </div>
  </div>
</div>
